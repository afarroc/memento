<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor de Imágenes - Original vs Procesado</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f9fafb;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* HEADER de la ventana */
  .header-bar {
    background: #f3f4f6;
    border-bottom: 1px solid #d1d5db;
    padding: 0.75rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-title {
    font-weight: 600;
    font-size: 0.95rem;
    color: #1f2937;
  }
  .zoom-controls {
    display: flex;
    gap: 0.5rem;
  }
  .btn-zoom {
    padding: 0.4rem 0.75rem;
    font-size: 1rem;
    border: 1px solid #d1d5db;
    background: #fff;
    border-radius: 0.375rem;
    cursor: pointer;
  }
  .btn-zoom:hover {
    background: #e5e7eb;
  }
  /* Área de contenido: dos paneles lado a lado */
  .preview-container-view {
    position: relative;
    overflow: hidden;
    background: #e5e7eb;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
  }
  .preview-container-view:active {
    cursor: grabbing;
  }
  .preview-container-view img,
  .preview-container-view canvas {
    display: block;
    max-width: none;
    max-height: none;
    width: auto;
    height: auto;
  }
  .preview-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    height: 100%;
  }
  .preview-pane {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .preview-pane-header {
    padding: 0.5rem 1rem;
    background: #f9fafb;
    border-bottom: 1px solid #e5e7eb;
    font-weight: 600;
    font-size: 0.875rem;
    color: #4b5563;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  /* Controles abajo */
  .controls-card {
    border: 1px solid #e5e7eb;
    border-radius: 0.5rem;
    background: #fff;
    overflow: hidden;
    margin-top: 1rem;
    min-height: 200px;
    display: flex;
    flex-direction: column;
  }
  .controls-header {
    background: #f3f4f6;
    border-bottom: 1px solid #e5e7eb;
    padding: 0.75rem 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .controls-header .title {
    font-weight: 600;
    font-size: 0.95rem;
    color: #374151;
  }
  .controls-body {
    padding: 1rem;
  }
  .mode-tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .mode-tab {
    padding: 0.5rem 1rem;
    border: 1px solid #d1d5db;
    background: #f9fafb;
    border-radius: 0.375rem;
    cursor: pointer;
    font-size: 0.875rem;
  }
  .mode-tab.active {
    background: #fff;
    border-color: #3b82f6;
    color: #2563eb;
    font-weight: 600;
  }
  .mode-panel {
    display: none;
  }
  .mode-panel.active {
    display: block;
  }
  .tools-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .tool-btn {
    padding: 0.5rem 0.75rem;
    border: 1px solid #d1d5db;
    background: #fff;
    border-radius: 0.375rem;
    cursor: pointer;
    font-size: 0.875rem;
  }
  .tool-btn:hover {
    background: #f3f4f6;
  }
  .mode-panel.active {
    display: block;
  }
  .btn-zoom {
    padding: 0.4rem 0.75rem;
    font-size: 1rem;
    border: 1px solid #d1d5db;
    background: #fff;
    border-radius: 0.375rem;
    cursor: pointer;
  }
  .btn-zoom:hover {
    background: #e5e7eb;
  }
  .preview-empty {
    color: #9ca3af;
    font-size: 0.875rem;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="preview-card">
    <!-- HEADER de la ventana -->
    <div class="preview-header-bar">
      <div class="title">
        <i class="fas fa-image"></i>
        <span>Vista previa de documento</span>
      </div>
      <div class="actions">
        <button type="button" class="btn-zoom" data-zoom-action="zoom-in">＋</button>
        <button type="button" class="btn-zoom" data-zoom-action="zoom-reset">⟲</button>
        <button type="button" class="btn-zoom" data-zoom-action="zoom-out">−</button>
      </div>
    </div>

    <div class="preview-container-view" data-zoomable>
      <div class="preview-grid">
        <!-- Panel Izquierdo: ORIGINAL -->
        <div class="preview-pane">
          <div class="preview-pane-header">
            <i class="fas fa-image"></i> Original
          </div>
          <img id="imgOriginal" alt="Original" class="preview-image" data-zoom-target>
        </div>

        <!-- Panel Derecho: PREPROCESADO -->
        <div class="preview-pane">
          <div class="preview-pane-header">
            <i class="fas fa-magic"></i> Preprocesado
          </div>
          <img id="imgProcesado" alt="Preprocesado" class="preview-image" data-zoom-target>
        </div>
      </div>
      <span class="zoom-badge" id="zoomBadge">100%</span>
    </div>
  </div>

  <div class="section-card mb-4">
    <div class="section-header section-header-dark">
      <div class="section-title">
        <i class="fas fa-cogs"></i>
        <h5>Controles de preprocesamiento</h5>
      </div>
    </div>
    <div class="section-body">
      <div class="mode-tabs">
        <button type="button" class="mode-tab active" data-mode="auto" id="tabModeAuto">
          <i class="fas fa-robot"></i> Automático
        </button>
        <button type="button" class="mode-tab" data-mode="manual" id="tabModeManual">
          <i class="fas fa-magic"></i> Manual (herramientas)
        </button>
      </div>

      <div id="panelAuto" class="mode-panel active">
        <form method="post" class="preprocess-params-form">
          <div class="metrics-grid">
            <div class="metric-item">
              <label class="metric-label" for="preprocess_target_dpi">DPI objetivo</label>
              <input type="number" id="preprocess_target_dpi" name="preprocess_target_dpi" value="300" min="72" max="600" class="form-control">
            </div>
            <div class="metric-item">
              <label class="metric-label" for="preprocess_binarize">Binarización</label>
              <select id="preprocess_binarize" name="preprocess_binarize" class="form-control">
                <option value="1" selected>Activa</option>
                <option value="0">Inactiva</option>
              </select>
            </div>
            <div class="metric-item">
              <label class="metric-label" for="preprocess_rotate">Rotación</label>
              <select id="preprocess_rotate" name="preprocess_rotate" class="form-control">
                <option value="0">0°</option>
                <option value="90">90°</option>
                <option value="180">180°</option>
                <option value="270">270°</option>
              </select>
            </div>
            <div class="metric-item metric-item-full">
              <label class="metric-label" for="preprocess_crop">Recorte automático</label>
              <select id="preprocess_crop" name="preprocess_crop" class="form-control">
                <option value="none" selected>Sin recorte</option>
                <option value="auto">Recorte automático de contenido</option>
                <option value="margins">Recorte de bordes</option>
              </select>
            </div>
            <div class="metric-item metric-item-full">
              <label class="metric-label" for="preprocess_deskew">Enderezar (deskew)</label>
              <select id="preprocess_deskew" name="preprocess_deskew" class="form-control">
                <option value="0" selected>Sin deskew</option>
                <option value="auto">Deskew automático</option>
              </select>
            </div>
          </div>
          <div class="preprocess-notes" style="margin-top:0.75rem;">
            <button type="button" class="btn btn-primary">
              <i class="fas fa-play"></i> Ejecutar preprocesamiento automático
            </button>
            <p class="text-sm text-muted" style="margin-top:0.5rem;">
              Se procesarán las imágenes del inbox con los parámetros seleccionados.
            </p>
          </div>
        </form>
      </div>

      <div id="panelManual" class="mode-panel" style="display:none;">
        <div class="editor-toolbar">
          <div class="editor-tool-group">
            <label class="editor-label">Herramientas</label>
            <div class="editor-tools">
              <button type="button" class="btn btn-sm btn-outline-secondary" data-tool="grayscale">Escala de grises</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" data-tool="blur">Blur</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" data-tool="threshold">Threshold</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" data-tool="rotate">Rotar</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" data-tool="invert">Invertir</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" data-tool="contrast">Contraste</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" data-tool="brightness">Brillo</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" data-tool="crop">Recortar</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" data-tool="deskew">Deskew</button>
            </div>
          </div>
          <div class="editor-tool-group">
            <label class="editor-label">Acciones</label>
            <div class="editor-actions">
              <button type="button" id="btnResetLayers" class="btn btn-sm btn-danger">Limpiar capas</button>
              <button type="button" id="btnApplyManual" class="btn btn-sm btn-success">Aplicar al documento</button>
            </div>
          </div>
        </div>

        <div class="editor-sidebar">
          <div class="editor-layers">
            <div class="editor-layers-header"><span>Capas</span><span class="editor-layers-count" id="layersCount">0</span></div>
            <div class="editor-layers-list" id="layersList"><div class="editor-empty">No hay capas aplicadas</div></div>
          </div>
          <div class="editor-params" id="editorParams" style="display:none;">
            <label class="editor-label">Parámetros</label>
            <div id="editorParamsForm"></div>
            <button type="button" id="btnUpdateLayer" class="btn btn-sm btn-primary" style="margin-top:0.5rem;">Actualizar capa</button>
          </div>
        </div>

        <div class="editor-status" id="editorStatus">
          <span class="editor-status-dot"></span><span id="editorStatusText"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="preprocess-nav">
    <a href="#" class="btn btn-ghost">← Volver</a>
    <a href="#" class="btn btn-primary">Avanzar a Metadatos →</a>
  </div>

</div>

<script>
(function() {
  'use strict';

  const ZOOM_STEP = 0.5;
  const MAX_ZOOM = 4;
  const MIN_ZOOM = 1;
  const dragState = new Map();

  function getContainers() {
    return Array.from(document.querySelectorAll('.preview-container-view[data-zoomable]'));
  }

  function getState(el) {
    return parseFloat(el.getAttribute('data-zoom-level') || '1');
  }

  function setState(el, level, ox, oy) {
    const img = el.querySelector('img, canvas');
    if (!img) return;
    level = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, level));
    el.setAttribute('data-zoom-level', level);
    if (level <= 1) {
      el.classList.remove('zoomed');
      img.style.transform = 'scale(1)';
      img.style.transformOrigin = '50% 50%';
      el.style.setProperty('--zoom-x', '50%');
      el.style.setProperty('--zoom-y', '50%');
    } else {
      el.classList.add('zoomed');
      const px = ox != null ? ox : 50;
      const py = oy != null ? oy : 50;
      img.style.transformOrigin = px + '% ' + py + '%';
      img.style.transform = 'scale(' + level + ')';
      el.style.setProperty('--zoom-x', px + '%');
      el.style.setProperty('--zoom-y', py + '%');
    }
    const badge = el.querySelector('.zoom-badge');
    if (badge) badge.textContent = Math.round(level * 100) + '%';
  }

  function syncAll() {
    const containers = getContainers();
    if (containers.length === 0) return;
    const first = containers[0];
    const level = getState(first);
    const ox = first.style.getPropertyValue('--zoom-x') || '50%';
    const oy = first.style.getPropertyValue('--zoom-y') || '50%';
    for (let i = 1; i < containers.length; i++) {
      setState(containers[i], level, parseFloat(ox), parseFloat(oy));
    }
  }

  // Botones de zoom
  document.addEventListener('click', function(e) {
    const btn = e.target.closest('[data-zoom-action]');
    if (!btn) return;
    const container = btn.closest('.preview-container-view[data-zoomable]');
    if (!container) return;
    const action = btn.getAttribute('data-zoom-action');
    const level = getState(container);
    if (action === 'zoom-in') {
      setState(container, Math.min(MAX_ZOOM, level + ZOOM_STEP));
      syncAll();
    } else if (action === 'zoom-reset') {
      setState(container, 1);
      syncAll();
    } else if (action === 'zoom-out') {
      setState(container, Math.max(MIN_ZOOM, level - ZOOM_STEP));
      syncAll();
    }
  });

  // Click en imagen para hacer zoom centrado
  document.addEventListener('click', function(e) {
    const container = e.target.closest('.preview-container-view[data-zoomable]');
    if (!container) return;
    const img = container.querySelector('img, canvas');
    if (!img) return;
    if (e.target.closest('[data-zoom-action]')) return;
    const currentLevel = getState(container);
    if (currentLevel <= 1) return;
    const imgRect = img.getBoundingClientRect();
    const imgX = ((e.clientX - imgRect.left) / imgRect.width) * 100;
    const imgY = ((e.clientY - imgRect.top) / imgRect.height) * 100;
    setState(container, 1, imgX, imgY);
    setState(container, 2, imgX, imgY);
    syncAll();
  });

  // Rueda del ratón para zoom centrado
  document.addEventListener('wheel', function(e) {
    const container = e.target.closest('.preview-container-view[data-zoomable]');
    if (!container) return;
    e.preventDefault();
    const img = container.querySelector('img, canvas');
    if (!img) return;
    const imgRect = img.getBoundingClientRect();
    const imgX = ((e.clientX - imgRect.left) / imgRect.width) * 100;
    const imgY = ((e.clientY - imgRect.top) / imgRect.height) * 100;
    const level = getState(container);
    const delta = e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP;
    setState(container, level + delta, imgX, imgY);
    syncAll();
  }, { passive: false });

  // ARRASTRAR para navegar cuando está zoomado
  document.addEventListener('mousedown', function(e) {
    const container = e.target.closest('.preview-container-view[data-zoomable]');
    if (!container) return;
    const img = container.querySelector('img, canvas');
    if (!img) return;
    if (getState(container) <= 1) return;
    dragState.set(container, {
      isDragging: true,
      startX: e.clientX,
      startY: e.clientY,
      startOriginX: parseFloat(container.style.getPropertyValue('--zoom-x') || '50'),
      startOriginY: parseFloat(container.style.getPropertyValue('--zoom-y') || '50'),
    });
  });

  document.addEventListener('mousemove', function(e) {
    dragState.forEach((state, container) => {
      if (!state.isDragging) return;
      const img = container.querySelector('img, canvas');
      if (!img) return;
      const dx = e.clientX - state.startX;
      const dy = e.clientY - state.startY;
      const rect = container.getBoundingClientRect();
      const dxPercent = (dx / rect.width) * 100;
      const dyPercent = (dy / rect.height) * 100;
      const newOx = Math.max(0, Math.min(100, state.startOriginX - dxPercent));
      const newOy = Math.max(0, Math.min(100, state.startOriginY - dyPercent));
      setState(container, getState(container), newOx, newOy);
      const containers = getContainers();
      containers.forEach(c => {
        if (c !== container) setState(c, getState(container), newOx, newOy);
      });
    });
  });

  document.addEventListener('mouseup', function() {
    dragState.forEach((state) => { state.isDragging = false; });
  });

  const tabAuto = document.getElementById('tabModeAuto');
  const tabManual = document.getElementById('tabModeManual');
  const panelAuto = document.getElementById('panelAuto');
  const panelManual = document.getElementById('panelManual');

  if (tabAuto && tabManual && panelAuto && panelManual) {
    tabAuto.addEventListener('click', function() {
      tabAuto.classList.add('active');
      tabManual.classList.remove('active');
      panelAuto.style.display = 'block';
      panelManual.style.display = 'none';
    });
    tabManual.addEventListener('click', function() {
      tabManual.classList.add('active');
      tabAuto.classList.remove('active');
      panelManual.style.display = 'block';
      panelAuto.style.display = 'none';
    });
  }

})();
</script>
</body>
</html>
