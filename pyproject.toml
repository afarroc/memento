[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mementobloom"
version = "0.1.0"
description = "MementoBloom - Sistema de Memoria Histórica IA"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "tools*"]
