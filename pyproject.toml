[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mementobloom"
version = "0.1.0"
description = "MementoBloom - Sistema de Memoria Histórica IA"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "tools*", "memento*"]

[project.scripts]
memento-bootstrap = "tools.bootstrap_context:main"
memento-doctor = "tools.doctor:main"
memento-md-to-pdf = "tools.md_to_pdf:main"
memento-session-start = "tools.session_start:main"
memento-quick-scan = "tools.quick_scan:main"

[project.optional-dependencies]
dev = [
    "redis>=8.0.0",
    "PyMySQL>=1.2.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.13.2",
    "et_xmlfile>=2.0.0",
]
